<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>权限组表单</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="../../assets/layui/css/layui.css" rel="stylesheet">
    <style>body { background-color: #fff; padding: 25px 30px; } .required-label:after { content: '*'; color: #ff4d4f; margin-left: 4px; }</style>
</head>
<body>

<form class="layui-form" lay-filter="formFilter">
    <input type="hidden" name="id">

    <div class="layui-form-item">
        <label class="layui-form-label required-label">权限组名称</label>
        <div class="layui-input-block">
            <input type="text" name="groupName" lay-verify="required" placeholder="如：数控车间早班组" class="layui-input">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">描述</label>
        <div class="layui-input-block">
            <input type="text" name="description" placeholder="请输入描述信息" class="layui-input">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">状态</label>
        <div class="layui-input-block">
            <input type="radio" name="status" value="1" title="启用" checked>
            <input type="radio" name="status" value="0" title="禁用">
        </div>
    </div>

    <div class="layui-form-item" style="text-align: right; margin-top: 30px;">
        <button type="button" class="layui-btn layui-btn-primary" onclick="closeSelf()">取消</button>
        <button class="layui-btn layui-btn-normal" lay-submit lay-filter="saveBtn">保存</button>
    </div>
</form>

<script src="../../assets/layui/layui.js"></script>
<script src="../../assets/js/common.js"></script>
<script>
    layui.use(['form', 'layer'], function () {
        var form = layui.form, layer = layui.layer;

        form.on('submit(saveBtn)', function (data) {
            MyConfig.request('/auth-group', 'POST', data.field, function() {
                layer.msg('保存成功', {icon: 1, time: 1000}, function() {
                    closeSelf();
                });
            });
            return false;
        });

        window.closeSelf = function() {
            var index = parent.layer.getFrameIndex(window.name);
            parent.layer.close(index);
        }

        window.setData = function(data) {
            form.val('formFilter', data);
        }
    });
</script>
</body>
</html>
