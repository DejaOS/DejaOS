spring.application.name=smartcabinet
server.port=15679
server.servlet.context-path=/smart-cabinet

# ==========================================
# 1. \u6570\u636E\u5E93\u914D\u7F6E (Database)
# ==========================================
app.database.type=${APP_DATABASE_TYPE:sqlite}
# Default: SQLite local file database. To switch to MySQL, set app.database.type=mysql,
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver, a jdbc:mysql URL,
# and spring.sql.init.mode=never after the MySQL schema has been prepared.
# MySQL example:
# app.database.type=mysql
# spring.datasource.url=jdbc:mysql://127.0.0.1:3306/smart-cabinet?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
# spring.datasource.username=root
# spring.datasource.password=your-password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.sql.init.mode=never
spring.datasource.url=${DB_URL:jdbc:sqlite:data/smart-cabinet.db}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.sqlite.JDBC}
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.schema-locations=${SQL_SCHEMA_LOCATIONS:classpath:schema-sqlite.sql}
spring.sql.init.continue-on-error=true

# ==========================================
# 2. MyBatis-Plus \u914D\u7F6E
# ==========================================
# \u5982\u679C\u4F60\u6709\u624B\u5199\u7684 XML Mapper \u6587\u4EF6\uFF0C\u5728\u8FD9\u91CC\u6307\u5B9A\u8DEF\u5F84
mybatis-plus.mapper-locations=classpath:mapper/*.xml

# \u5F00\u542F\u5B9E\u4F53\u7C7B\u522B\u540D\u626B\u63CF (\u6BD4\u5982 cn.koodle.entity.User -> resultType="User")
mybatis-plus.type-aliases-package=cn.koodle.smartcabinet.entity

# Route SQL logs through SLF4J/Logback so they use the same timestamped format as Spring logs.
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# \u5F00\u542F\u9A7C\u5CF0\u547D\u540D\u81EA\u52A8\u6620\u5C04 (create_time -> createTime)
mybatis-plus.configuration.map-underscore-to-camel-case=true

# ==========================================
# 3. Swagger (SpringDoc) \u914D\u7F6E
# ==========================================
springdoc.swagger-ui.path=/doc.html
springdoc.api-docs.path=/v3/api-docs

# ==========================================
# 4. \u65E5\u5FD7\u914D\u7F6E (Logging)
# ==========================================
# \u8BBE\u5B9A\u5168\u5C40\u65E5\u5FD7\u7EA7\u522B
logging.level.root=INFO

# \u8BBE\u5B9A\u4F60\u81EA\u5DF1\u7684\u5305\u65E5\u5FD7\u7EA7\u522B\u4E3A DEBUG (\u5F00\u53D1\u8C03\u8BD5\u7528)
logging.level.cn.koodle=DEBUG

# MyBatis SQL logs. Change to INFO or WARN if the console becomes too noisy.
logging.level.cn.koodle.smartcabinet.dao=DEBUG
logging.level.org.mybatis=DEBUG
logging.level.org.apache.ibatis=DEBUG

# \u5982\u679C\u60F3\u628A\u65E5\u5FD7\u8F93\u51FA\u5230\u6587\u4EF6
# logging.file.name=logs/app.log

# \u5168\u5C40\u6307\u5B9A JSON \u5E8F\u5217\u5316\u548C\u53CD\u5E8F\u5217\u5316\u7684\u65F6\u95F4\u683C\u5F0F
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# \u8BBE\u5B9A\u65F6\u533A\uFF0C\u907F\u514D\u65F6\u95F4\u76F8\u5DEE8\u5C0F\u65F6\u7684\u95EE\u9898 (\u56FD\u5185\u9879\u76EE\u5FC5\u5907)
spring.jackson.time-zone=GMT+8

# \u6587\u4EF6\u670D\u52A1\u5668\u6839\u8DEF\u5F84
app.file.base-url=${APP_FILE_BASE_URL:http://192.168.50.30:15679}
app.device.sign-secret=${APP_DEVICE_SIGN_SECRET:}
