<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>MQTT 记录</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="../../assets/layui/css/layui.css" rel="stylesheet">
    <style>
        body { background: #f6f8fb; color: #1f2937; }
        .page-wrap { padding: 15px; }
        .layui-card { border-radius: 6px; box-shadow: 0 1px 2px rgba(15, 23, 42, .06); }
        .search-container { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; padding-bottom: 18px; }
        .search-item { display: flex; align-items: center; gap: 8px; }
        .search-item label { white-space: nowrap; color: #4b5563; }
        .search-item .layui-input, .search-item .layui-form-select { width: 180px; }
        .search-actions { margin-left: auto; display: flex; gap: 10px; }
        .direction-tag { display: inline-block; min-width: 48px; text-align: center; border-radius: 3px; padding: 2px 8px; font-size: 12px; }
        .direction-send { color: #0f766e; background: #ccfbf1; }
        .direction-receive { color: #1d4ed8; background: #dbeafe; }
        .payload-preview { color: #475569; font-family: Consolas, "Courier New", monospace; white-space: nowrap; }
        .detail-wrap { padding: 18px 20px; }
        .detail-label { color: #667085; font-size: 12px; margin-bottom: 4px; }
        .detail-topic { padding: 10px 12px; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 5px; word-break: break-all; font-family: Consolas, "Courier New", monospace; }
        .json-view { margin-top: 12px; padding: 14px; background: #0f172a; color: #d1d5db; border-radius: 6px; max-height: 520px; overflow: auto; font-family: Consolas, "Courier New", monospace; font-size: 13px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
        .json-key { color: #7dd3fc; }
        .json-string { color: #86efac; }
        .json-number { color: #fbbf24; }
        .json-boolean { color: #f472b6; }
        .json-null { color: #a78bfa; }
    </style>
</head>
<body>
<div class="page-wrap">
    <div class="layui-card">
        <div class="layui-card-body" style="padding: 20px;">
            <form class="layui-form search-container" lay-filter="searchForm">
                <div class="search-item">
                    <label>设备 SN</label>
                    <input type="text" name="deviceSn" placeholder="uuid" class="layui-input">
                </div>
                <div class="search-item">
                    <label>方向</label>
                    <select name="direction">
                        <option value="">全部</option>
                        <option value="SEND">发送</option>
                        <option value="RECEIVE">接收</option>
                    </select>
                </div>
                <div class="search-item">
                    <label>Topic</label>
                    <input type="text" name="topic" placeholder="topic 关键字" class="layui-input" style="width:260px;">
                </div>
                <div class="search-item">
                    <label>时间</label>
                    <input type="text" class="layui-input" id="dateRange" placeholder="开始时间 - 结束时间" style="width: 300px;">
                    <input type="hidden" name="startTime" id="startTime">
                    <input type="hidden" name="endTime" id="endTime">
                </div>
                <div class="search-actions">
                    <button class="layui-btn layui-btn-normal" lay-submit lay-filter="search">
                        <i class="layui-icon layui-icon-search"></i> 查询
                    </button>
                    <button type="reset" class="layui-btn layui-btn-primary" id="btnReset">
                        <i class="layui-icon layui-icon-refresh"></i> 重置
                    </button>
                </div>
            </form>

            <table class="layui-hide" id="table" lay-filter="tableFilter"></table>

            <script type="text/html" id="bar">
                <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="detail">详情</a>
                <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="delete">删除</a>
            </script>
        </div>
    </div>
</div>

<div id="detailDialog" style="display:none;">
    <div class="detail-wrap">
        <div class="detail-label">Topic</div>
        <div class="detail-topic" id="detailTopic"></div>
        <div class="detail-label" style="margin-top:14px;">Payload</div>
        <pre class="json-view" id="detailPayload"></pre>
    </div>
</div>

<script src="../../assets/layui/layui.js"></script>
<script src="../../assets/js/common.js"></script>
<script>
layui.use(['form', 'table', 'layer', 'laydate'], function () {
    var $ = layui.jquery;
    var form = layui.form;
    var table = layui.table;
    var layer = layui.layer;
    var laydate = layui.laydate;
    var token = localStorage.getItem('token');

    laydate.render({
        elem: '#dateRange',
        type: 'datetime',
        range: true,
        done: function (value) {
            if (!value) {
                $('#startTime').val('');
                $('#endTime').val('');
                return;
            }
            var parts = value.split(' - ');
            $('#startTime').val(parts[0]);
            $('#endTime').val(parts[1]);
        }
    });

    function escapeHtml(text) {
        return String(text == null ? '' : text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function preview(text, max) {
        text = String(text == null ? '' : text).replace(/\s+/g, ' ');
        if (text.length <= max) return escapeHtml(text);
        return escapeHtml(text.substring(0, max)) + '...';
    }

    function directionText(direction) {
        if (direction === 'SEND') return '<span class="direction-tag direction-send">发送</span>';
        if (direction === 'RECEIVE') return '<span class="direction-tag direction-receive">接收</span>';
        return escapeHtml(direction || '');
    }

    function formatPayload(payload) {
        if (!payload) return '';
        try {
            return JSON.stringify(JSON.parse(payload), null, 2);
        } catch (e) {
            return payload;
        }
    }

    function syntaxHighlight(json) {
        return escapeHtml(json).replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
            var cls = 'json-number';
            if (/^"/.test(match)) cls = /:$/.test(match) ? 'json-key' : 'json-string';
            else if (/true|false/.test(match)) cls = 'json-boolean';
            else if (/null/.test(match)) cls = 'json-null';
            return '<span class="' + cls + '">' + match + '</span>';
        });
    }

    table.render({
        elem: '#table',
        url: MyConfig.API_BASE + '/mqtt-command-log/page',
        headers: {'Authorization': 'Bearer ' + token},
        request: {pageName: 'pageNo', limitName: 'pageSize'},
        parseData: function (res) {
            var records = res.data ? res.data.records : [];
            return {
                code: (res.code === 0 || res.code === 200) ? 0 : 1,
                msg: res.message,
                count: res.data ? res.data.total : 0,
                data: records
            };
        },
        cols: [[
            {field: 'topic', title: 'Topic', minWidth: 260, templet: function (d) { return preview(d.topic, 80); }},
            {field: 'direction', title: '发送/接收', width: 110, align: 'center', templet: function (d) { return directionText(d.direction); }},
            {field: 'deviceSn', title: '设备 SN(uuid)', width: 150},
            {field: 'commandTime', title: '时间', width: 180, templet: function (d) { return MyConfig.formatDate(d.commandTime); }},
            {field: 'payload', title: 'Payload', minWidth: 320, templet: function (d) { return '<span class="payload-preview">' + preview(d.payload, 160) + '</span>'; }},
            {title: '操作', width: 130, toolbar: '#bar', align: 'center', fixed: 'right'}
        ]],
        limits: [10, 20, 50, 100],
        limit: 20,
        page: true,
        skin: 'line'
    });

    form.on('submit(search)', function (data) {
        var fields = data.field;
        Object.keys(fields).forEach(function (key) {
            if (fields[key] === '') delete fields[key];
        });
        table.reload('table', {page: {curr: 1}, where: fields});
        return false;
    });

    $('#btnReset').on('click', function () {
        $('#startTime').val('');
        $('#endTime').val('');
        table.reload('table', {page: {curr: 1}, where: {}});
    });

    table.on('tool(tableFilter)', function (obj) {
        var data = obj.data;
        if (obj.event === 'delete') {
            layer.confirm('确定删除这条 MQTT 记录吗？', {icon: 3}, function (index) {
                MyConfig.request('/mqtt-command-log/' + data.id, 'DELETE', {}, function () {
                    layer.close(index);
                    layer.msg('删除成功', {icon: 1});
                    table.reload('table');
                });
            });
        }
        if (obj.event === 'detail') {
            MyConfig.request('/mqtt-command-log/' + data.id, 'GET', {}, function (detail) {
                $('#detailTopic').text(detail.topic || '');
                $('#detailPayload').html(syntaxHighlight(formatPayload(detail.payload)));
                layer.open({
                    type: 1,
                    title: 'MQTT 详情',
                    area: ['860px', '680px'],
                    content: $('#detailDialog')
                });
            });
        }
    });
});
</script>
</body>
</html>
