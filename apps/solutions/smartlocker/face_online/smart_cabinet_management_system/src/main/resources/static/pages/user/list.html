<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>人员管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="../../assets/layui/css/layui.css" rel="stylesheet">
    <style>
        body { background-color: #f2f2f2; color: #333; padding: 15px; font-family: "Microsoft YaHei", sans-serif; }
        .layui-card { border-radius: 4px; box-shadow: 0 1px 2px rgba(0, 0, 0, .05); }
        .search-container { display: flex; align-items: center; flex-wrap: wrap; gap: 18px; padding: 12px 0 20px; }
        .search-item { display: flex; align-items: center; }
        .search-item label { margin-right: 10px; color: #555; font-weight: 500; }
        .search-item .layui-input, .search-item .layui-form-select .layui-input { width: 160px; height: 38px; }
        .search-actions { margin-left: auto; display: flex; gap: 10px; }
        .user-name-cell { display: inline-flex; align-items: center; min-height: 34px; }
        .user-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; margin-right: 8px; border: 1px solid #eee; background: #f7f7f7; flex: 0 0 auto; }
    </style>
</head>
<body>

<div class="layui-card">
    <div class="layui-card-body" style="padding: 20px;">
        <form class="layui-form search-container" lay-filter="searchForm">
            <div class="search-item">
                <label>姓名</label>
                <input type="text" name="name" placeholder="请输入姓名" class="layui-input">
            </div>
            <div class="search-item">
                <label>人员ID</label>
                <input type="text" name="userId" placeholder="请输入人员ID" class="layui-input">
            </div>
            <div class="search-item">
                <label>手机号</label>
                <input type="text" name="phone" placeholder="请输入手机号" class="layui-input">
            </div>
            <div class="search-item">
                <label>所属分组</label>
                <div style="width: 160px;">
                    <select name="groupId" id="groupSelect" lay-search>
                        <option value="">全部分组</option>
                    </select>
                </div>
            </div>
            <div class="search-actions">
                <button class="layui-btn layui-btn-normal" lay-submit lay-filter="searchBtn"><i class="layui-icon layui-icon-search"></i> 搜索</button>
                <button type="reset" class="layui-btn layui-btn-primary" id="btn-reset">重置</button>
            </div>
        </form>

        <div style="border-top: 1px solid #f0f0f0; margin: 0 -20px 20px;"></div>

        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="add"><i class="layui-icon layui-icon-add-1"></i> 新增人员</button>
            </div>
        </script>

        <table id="userTable" lay-filter="userTable"></table>

        <script type="text/html" id="rowBar">
            <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
            <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="delete">删除</a>
        </script>
    </div>
</div>

<script src="../../assets/layui/layui.js"></script>
<script src="../../assets/js/common.js"></script>
<script>
layui.use(['form', 'table', 'layer'], function () {
    var $ = layui.jquery, form = layui.form, table = layui.table, layer = layui.layer;
    var token = localStorage.getItem('token');

    MyConfig.request('/user-group/tree', 'GET', {}, function (data) {
        var options = '<option value="">全部分组</option>';
        function buildOptions(list, level) {
            layui.each(list || [], function (_, item) {
                var prefix = level > 0 ? '&nbsp;&nbsp;'.repeat(level) + '└ ' : '';
                options += '<option value="' + item.id + '">' + prefix + item.name + '</option>';
                if (item.children && item.children.length > 0) buildOptions(item.children, level + 1);
            });
        }
        buildOptions(data, 0);
        $('#groupSelect').html(options);
        form.render('select');
    });

    table.render({
        elem: '#userTable',
        url: MyConfig.API_BASE + '/user/page',
        headers: {'Authorization': 'Bearer ' + token},
        request: {pageName: 'pageNo', limitName: 'pageSize'},
        parseData: function (res) {
            var records = res.data ? res.data.records : [];
            return {code: (res.code === 0 || res.code === 200) ? 0 : 1, msg: res.message, count: res.data ? res.data.total : 0, data: records};
        },
        toolbar: '#toolbarDemo',
        defaultToolbar: ['filter', 'exports', 'print'],
        cols: [[
            {type: "checkbox", width: 50},
            {field: 'name', title: '姓名', width: 220, templet: function (d) {
                var url = normalizeFileUrl(d.faceImageUrl || '');
                var img = url ? '<img src="' + url + '" class="user-avatar">' : '<span class="user-avatar" style="display:inline-block;"></span>';
                return '<span class="user-name-cell">' + img + '<span>' + (d.name || '-') + '</span></span>';
            }},
            {field: 'userId', title: '人员ID', width: 160, sort: true},
            {field: 'phone', title: '手机号', width: 140},
            {field: 'pin', title: 'PIN', width: 100},
            {field: 'groupName', title: '所属分组', width: 140, align: 'center'},
            {field: 'role', title: '设备角色', width: 120, align: 'center', templet: function (d) {
                return d.role === 1 ? '<span class="layui-badge layui-bg-blue">设备管理员</span>' : '<span class="layui-badge-rim">普通用户</span>';
            }},
            {field: 'createTime', title: '创建时间', width: 180, align: 'center', templet: function (d) { return MyConfig.formatDate(d.createTime); }},
            {title: '操作', toolbar: '#rowBar', width: 150, align: 'center', fixed: 'right'}
        ]],
        page: true,
        limits: [10, 20, 50],
        skin: 'line'
    });

    form.on('submit(searchBtn)', function (data) {
        var fields = data.field;
        for (var k in fields) if (fields[k] === '') delete fields[k];
        table.reload('userTable', {page: {curr: 1}, where: fields});
        return false;
    });

    $('#btn-reset').click(function () {
        $('form[lay-filter="searchForm"]')[0].reset();
        table.reload('userTable', {page: {curr: 1}, where: {}});
    });

    table.on('toolbar(userTable)', function (obj) {
        if (obj.event === 'add') {
            MyConfig.openFormModal('form.html', '新增人员', '980px', '620px', function () { table.reload('userTable'); });
        }
    });

    table.on('tool(userTable)', function (obj) {
        var data = obj.data;
        if (obj.event === 'edit') {
            layer.open({
                type: 2,
                title: '编辑人员',
                area: ['980px', '620px'],
                content: 'form.html?id=' + data.id + '&v=' + Date.now(),
                success: function (layero) {
                    var iframeWin = window[layero.find('iframe')[0]['name']];
                    setTimeout(function () {
                        if (typeof iframeWin.setData === 'function') iframeWin.setData(data);
                    }, 100);
                },
                end: function () { table.reload('userTable'); }
            });
        } else if (obj.event === 'delete') {
            layer.confirm('确定要删除该人员吗？', function (index) {
                MyConfig.request('/user/' + data.id, 'DELETE', {}, function () {
                    layer.msg('删除成功');
                    obj.del();
                    layer.close(index);
                });
            });
        }
    });

    function normalizeFileUrl(url) {
        if (!url || url.indexOf('/files/') !== 0) return url;
        var firstPath = window.location.pathname.split('/')[1];
        return firstPath ? '/' + firstPath + url : url;
    }
});
</script>
</body>
</html>
